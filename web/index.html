<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iSekur Webchat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23c792ea%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0e0f17; --fg: #d6d8e6; --muted: #6b6f8a; --panel: #151725; --line: #24273a;
  --accent: #c792ea; --accent2: #82aaff; --hl-bg: #4a1d3f; --err: #ff5370;
  --join: #c3e88d; --part: #f78c6c; --info: #89ddff; --notice: #ffcb6b; --action: #c792ea;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--mono); }
button, input { font: inherit; color: inherit; }
#login { display: none; height: 100%; align-items: center; justify-content: center; padding: 16px; }
#login form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 28px; display: grid; gap: 12px; position: relative;
  box-shadow: 0 0 0 1px #0004, 0 20px 60px -20px var(--accent); }
#login h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .5px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--join));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
#login input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
#login input:focus { outline: 2px solid var(--accent2); outline-offset: -1px; }
#login button { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #111;
  border: 0; border-radius: 8px; padding: 10px; font-weight: 700; cursor: pointer; }
#ver { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: var(--muted); opacity: .6; }
#loginerr { color: var(--err); min-height: 1.4em; font-size: 13px; }

#app { display: none; height: 100%; grid-template-columns: 220px 1fr auto;
  grid-template-rows: auto 1fr auto auto; grid-template-areas: "side topic topic" "side msgs nicks" "side status status" "foot input input"; }
#side { grid-area: side; background: var(--tabbar-bg, var(--panel)); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 0; }
#side .srv { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px 4px; }
#side .tab { display: flex; gap: 8px; padding: 4px 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent; }
#side .tab .n { color: var(--muted); min-width: 1.6em; text-align: right; }
#side .tab:hover { background: #ffffff08; }
#side .srv[data-id] { cursor: pointer; user-select: none; }
#side .srv[data-id]:hover { color: var(--fg); }
#side .tab.home { color: var(--tab_home-fg, var(--info)); }
#side .tab.server { color: var(--tab_server-fg, inherit); }
#side .tab.shell { color: var(--tab_shell-fg, var(--tab_home-fg, inherit)); }
#side .tab .more { color: var(--muted); }
#side .tab.active { background: var(--tab_active-bg, #ffffff12); color: var(--tab_active-fg, inherit); border-left-color: var(--accent); }
#side .tab.a1 { color: var(--tab_data-fg, #9aa0c0); }
#side .tab.a2 { color: var(--tab_msg-fg, #ffffff); font-weight: 700; }
#side .tab.a3 { color: var(--tab_hilight-fg, #ff6ac1); font-weight: 700; }
#side .tab.off { opacity: .55; }
/* bottom left: add a server, settings, about */
#foot { grid-area: foot; display: flex; gap: 6px; padding: 8px 10px; background: var(--tabbar-bg, var(--panel)); border-right: 1px solid var(--line); }
#foot button { flex: 1; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; cursor: pointer; color: var(--muted); font-size: 15px; }
#foot button:hover { color: var(--fg); border-color: var(--accent); }
/* dialogs: a box with its title on the border, like the terminal's */
dialog { background: var(--menu-bg, var(--panel)); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: #0009; }
dialog form { display: grid; gap: 10px; padding: 18px 20px; }
dialog h2 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
dialog label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
dialog label.ck { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 13px; }
dialog input:not([type=checkbox]) { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; color: var(--fg); min-width: 0; }
dialog input:focus { outline: none; border-color: var(--accent); }
dialog .row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
dialog .btns button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
dialog .btns button.go { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #111; border: 0; font-weight: 700; }
dialog .hint { color: var(--muted); font-size: 12px; min-height: 1em; }
#dabout { width: min(720px, calc(100vw - 32px)); }
#abox { font-size: 13px; line-height: 1.4; }
#abox a { color: var(--accent2); }
#abanner { position: relative; display: inline-block; white-space: pre; line-height: 1; margin-bottom: 6px; overflow: hidden; }
#atext { white-space: pre-wrap; }
/* the terminal's light sweep: a slanted white band crossing the banner every 3.5s */
#abanner::after { content: ""; position: absolute; inset: -20% auto -20% 0; width: 18%; pointer-events: none;
  background: linear-gradient(90deg, transparent, #ffffffb0, transparent); transform: skewX(-25deg) translateX(-200%);
  mix-blend-mode: overlay; animation: shine 3.5s ease-in-out infinite; }
@keyframes shine { 0% { left: 0; transform: skewX(-25deg) translateX(-200%); } 34%, 100% { left: 100%; transform: skewX(-25deg) translateX(100%); } }
@media (prefers-reduced-motion: reduce) { #abanner::after { animation: none; display: none; } }
#atext > div { animation: rise .5s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
#setlist { overflow-y: auto; max-height: 55vh; display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 4px 10px; align-items: center; }
#setlist .sec { grid-column: 1 / -1; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding-top: 8px; }
#setlist .k { font-size: 13px; overflow-wrap: anywhere; }
#setlist .k.uns::after { content: " ●"; color: var(--accent); }
#setlist input.chg { border-color: var(--accent2); }
#topic { grid-area: topic; background: var(--topic-bg, var(--panel)); color: var(--topic-fg, inherit);
  padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; min-height: 38px; }
#topic .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
#topic .t.full { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; }
#topic button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
#menu { display: none; }
#ctx { position: fixed; z-index: 9; min-width: 170px; background: var(--menu-bg, var(--panel)); color: var(--menu-fg, var(--fg));
  border: 1px solid var(--menu_border-fg, var(--line)); border-radius: 8px; padding: 4px 0; box-shadow: 0 10px 30px #0008; }
#ctx .hd { padding: 4px 12px; font-weight: 700; }
#ctx .it { padding: 4px 12px; cursor: pointer; white-space: nowrap; }
#ctx .it:hover { background: var(--menu_sel-bg, var(--accent)); color: var(--menu_sel-fg, #111); }
#ctx hr { border: 0; border-top: 1px solid var(--menu_border-fg, var(--line)); margin: 4px 0; }
#msgs { grid-area: msgs; overflow-y: auto; padding: 6px 0; overflow-wrap: anywhere; }
.newmark { display: flex; align-items: center; gap: 8px; margin: 4px 10px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .1em; color: var(--marker-fg, #c2185b); }
.newmark::before, .newmark::after { content: ""; flex: 1; border-top: 1px solid currentColor; }
.l { display: grid; grid-template-columns: auto 13ch 1fr; gap: 0 10px; padding: 1px 14px; }
.l:hover { background: #ffffff06; }
.l .ts { color: var(--timestamp-fg, var(--muted)); }
.l .nk { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-right: 1px solid var(--separator-fg, var(--line)); padding-right: 10px; }
.l .tx { white-space: pre-wrap; }
.l.hdr .tx { cursor: pointer; }
.l.chrow:hover { background: rgba(127, 127, 127, .12); cursor: pointer; }
.l.hl .nk { background: var(--hilight-bg, var(--hl-bg)); color: var(--hilight-fg, #fff); border-radius: 4px 0 0 4px; }
.l.hl { background: #ff00aa10; }
.k-join, .k-join .nk { color: var(--join-fg, var(--join)); }
.k-part, .k-part .nk, .k-quit, .k-quit .nk { color: var(--part-fg, var(--part)); }
.k-info .tx, .k-nick .tx, .k-mode .tx, .k-topic .tx, .k-info .nk, .k-nick .nk, .k-mode .nk, .k-topic .nk { color: var(--info-fg, var(--info)); }
.k-error .tx, .k-error .nk { color: var(--error-fg, var(--err)); }
.k-notice .nk { color: var(--notice-fg, var(--notice)); }
.k-action .tx, .k-action .nk { color: var(--action-fg, var(--action)); font-style: italic; }
.l .self { color: var(--msg_self-fg, var(--accent2)); }
.tx a { color: var(--accent2); }
#nicks { grid-area: nicks; width: 190px; background: var(--nicklist-bg, var(--panel)); border-left: 1px solid var(--line); overflow-y: auto; padding: 6px 0; }
#nicks .hd { color: var(--muted); padding: 2px 12px 6px; font-size: 12px; }
#nicks div.u { padding: 1px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
#nicks .op { color: var(--nicklist_op-fg, #ff9e64); }
#nicks .voice { color: var(--nicklist_voice-fg, #9ece6a); }
#nicks .away { opacity: .45; }
@media (min-width: 761px) { #nicks.off { display: none; } }
#status { grid-area: status; background: var(--status-bg, var(--panel)); color: var(--status-fg, var(--muted)); padding: 3px 14px; font-size: 12px; border-top: 1px solid var(--line); }
#status b { color: var(--status_hi-fg, var(--fg)); font-weight: 400; }
#input { grid-area: input; display: flex; gap: 8px; padding: 8px 10px; background: var(--input-bg, var(--bg)); }
#prompt { color: var(--input_prompt-fg, var(--accent)); align-self: center; white-space: nowrap; }
#line { flex: 1; min-width: 0; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--input-fg, var(--fg)); }
#line:focus { outline: none; border-color: var(--accent); }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "topic" "msgs" "status" "input"; }
  #side { display: none; position: fixed; inset: 0 30% 0 0; z-index: 5; box-shadow: 0 0 40px #000; }
  #side.open { display: block; padding-bottom: 56px; }
  #foot { display: none; }
  #side.open ~ #foot { display: flex; position: fixed; left: 0; right: 30%; bottom: 0; z-index: 6; }
  #nicks { display: none; position: fixed; inset: 0 0 0 40%; z-index: 5; width: auto; }
  #nicks.open { display: block; }
  #menu { display: inline-block; }
  .l { display: block; padding: 2px 10px; }
  .l .ts { display: none; }
  .l .nk { display: inline; border: 0; padding: 0 6px 0 0; font-weight: 700; }
  .l.hl .nk { padding: 0 4px; margin-right: 6px; border-radius: 4px; }
}
</style>
</head>
<body>
<div id="login">
  <form id="lf" autocomplete="on">
    <h1>iSekur</h1>
    <input id="lu" name="username" placeholder="user" autocomplete="username" required>
    <input id="lp" name="password" type="password" placeholder="password" autocomplete="current-password" required>
    <button>Connect</button>
    <div id="loginerr"></div>
    <div id="ver">v@ISEKUR_VERSION@</div>
  </form>
</div>
<div id="app">
  <nav id="side"></nav>
  <div id="foot"><button id="addsrv" title="Add a server" aria-label="Add a server">+</button><button id="setbtn" title="Settings" aria-label="Settings">⚙</button><button id="aboutbtn" title="About iSekur" aria-label="About iSekur">ⓘ</button></div>
  <div id="topic"><button id="menu" aria-label="Windows">☰</button><span class="t"></span><button id="nickbtn" aria-label="Users">👥</button><button id="bell" aria-label="Notifications">🔕</button><button id="logout">logout</button></div>
  <main id="msgs" aria-live="polite"></main>
  <aside id="nicks"></aside>
  <div id="status"></div>
  <form id="input"><span id="prompt"></span><input id="line" autocomplete="off" spellcheck="true" aria-label="Message"></form>
</div>
<dialog id="dsrv"><form method="dialog">
  <h2>Add a server</h2>
  <div class="row2"><label>Host or IP<input name="host" required placeholder="irc.sekurnet.org"></label><label>Port<input name="port" type="number" min="1" max="65535" value="6697"></label></div>
  <label>Network name (its [server.name] in the config)<input name="name" pattern="[A-Za-z0-9._\-]+" placeholder="sekurnet" title="letters, digits, . _ and - only"></label>
  <label>Nickname<input name="nick" placeholder="(your default nick)"></label>
  <label class="ck"><input type="checkbox" name="tls" checked> SSL/TLS</label>
  <label class="ck"><input type="checkbox" name="verify" checked> Verify the certificate (off for self-signed servers)</label>
  <label class="ck"><input type="checkbox" name="save" checked> Save it to the config (/save)</label>
  <div class="btns"><button value="cancel" formnovalidate>Cancel</button><button class="go" value="ok">Connect</button></div>
</form></dialog>
<dialog id="dset"><form method="dialog">
  <h2>Settings</h2>
  <input id="setq" placeholder="Filter keys..." autocomplete="off">
  <div id="setlist"></div>
  <div class="hint" id="setmsg">Empty = the default. ● = changed and not saved yet.</div>
  <div class="btns"><button value="cancel" formnovalidate>Close</button><button value="apply">Apply</button><button class="go" value="save">Apply &amp; save</button></div>
</form></dialog>
<dialog id="dabout"><form method="dialog">
  <div id="abox"><div id="abanner"></div><div id="atext"></div></div>
  <div class="btns"><button class="go" value="ok">Close</button></div>
</form></dialog>
<script>
"use strict";
const $ = s => document.querySelector(s);
const bufs = new Map(); let order = [], active = 0, ws = null, theme = {nicks: []};
const hist = []; let hpos = 0;
const MIRC = [0xffffff,0x000000,0x00007f,0x009300,0xff0000,0x7f0000,0x9c009c,0xfc7f00,0xffff00,0x00fc00,0x009393,0x00ffff,0x0000fc,0xff00ff,0x7f7f7f,0xd2d2d2,
0x470000,0x472100,0x474700,0x324700,0x004700,0x00472c,0x004747,0x002747,0x000047,0x2e0047,0x470047,0x47002a,0x740000,0x743a00,0x747400,0x517400,0x007400,0x007449,0x007474,0x004074,0x000074,0x4b0074,0x740074,0x740045,
0xb50000,0xb56300,0xb5b500,0x7db500,0x00b500,0x00b571,0x00b5b5,0x0063b5,0x0000b5,0x7500b5,0xb500b5,0xb5006b,0xff0000,0xff8c00,0xffff00,0xb2ff00,0x00ff00,0x00ffa0,0x00ffff,0x008cff,0x0000ff,0xa500ff,0xff00ff,0xff0098,
0xff5959,0xffb459,0xffff71,0xcfff60,0x6fff6f,0x65ffc9,0x6dffff,0x59b4ff,0x5959ff,0xc459ff,0xff66ff,0xff59bc,0xff9c9c,0xffd39c,0xffff9c,0xe2ff9c,0x9cff9c,0x9cffdb,0x9cffff,0x9cd3ff,0x9c9cff,0xdc9cff,0xff9cff,0xff94d3,
0x000000,0x131313,0x282828,0x363636,0x4d4d4d,0x656565,0x818181,0x9f9f9f,0xbcbcbc,0xe2e2e2,0xffffff].map(c => "#" + c.toString(16).padStart(6, "0"));

const ircLower = s => s.toLowerCase().replace(/[\[\]\\~]/g, c => ({"[":"{","]":"}","\\":"|","~":"^"})[c]);
function nickColor(n) {
  let h = 5381; const s = ircLower(n);
  for (const b of new TextEncoder().encode(s)) h = (Math.imul(h, 33) + b) >>> 0;
  return theme.nicks.length ? theme.nicks[h % theme.nicks.length] : "";
}

// mIRC formatting -> DOM (text only ever goes through textContent)
const URL_RE = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]]/g;
function addText(parent, text, st) {
  if (!text) return;
  const span = document.createElement("span");
  let fg = st.fg, bg = st.bg;
  if (st.rev) [fg, bg] = [bg || "var(--bg)", fg || "var(--fg)"];
  if (fg) span.style.color = fg;
  if (bg) span.style.background = bg;
  if (st.b) span.style.fontWeight = "700";
  if (st.i) span.style.fontStyle = "italic";
  if (st.u) span.style.textDecoration = "underline";
  let last = 0;
  for (const m of text.matchAll(URL_RE)) {
    span.append(text.slice(last, m.index));
    const a = document.createElement("a");
    a.href = m[0]; a.textContent = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer";
    span.append(a); last = m.index + m[0].length;
  }
  span.append(text.slice(last));
  parent.append(span);
}
function mirc(parent, s) {
  let st = {}, buf = "";
  const flush = () => { addText(parent, buf, st); buf = ""; };
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === "\x02") { flush(); st = {...st, b: !st.b}; }
    else if (c === "\x1d") { flush(); st = {...st, i: !st.i}; }
    else if (c === "\x1f") { flush(); st = {...st, u: !st.u}; }
    else if (c === "\x16") { flush(); st = {...st, rev: !st.rev}; }
    else if (c === "\x0f") { flush(); st = {}; }
    else if (c === "\x1e" || c === "\x11") {}
    else if (c === "\x03") {
      flush();
      const m = /^(\d{1,2})(?:,(\d{1,2}))?/.exec(s.slice(i + 1));
      st = {...st};
      if (!m) { st.fg = st.bg = undefined; continue; }
      st.fg = MIRC[+m[1]]; if (m[2] !== undefined) st.bg = MIRC[+m[2]];
      i += m[0].length;
    } else if (c === "\x04") {
      flush();
      const m = /^([0-9a-fA-F]{6})(?:,([0-9a-fA-F]{6}))?/.exec(s.slice(i + 1));
      st = {...st};
      if (!m) { st.fg = st.bg = undefined; continue; }
      st.fg = "#" + m[1]; if (m[2]) st.bg = "#" + m[2];
      i += m[0].length;
    } else if (c >= " ") buf += c;
  }
  flush();
}

const MARK = {join: "-->", part: "<--", quit: "<--", error: "!!", info: "--", nick: "--", mode: "--", topic: "--"};
function lineEl(b, l) {
  const d = document.createElement("div");
  d.className = "l k-" + l.k + (l.h ? " hl" : "");
  const ts = document.createElement("span"); ts.className = "ts";
  const t = new Date(l.ts * 1000); ts.textContent = t.toTimeString().slice(0, 5);
  const nk = document.createElement("span"); nk.className = "nk";
  const tx = document.createElement("span"); tx.className = "tx";
  if (l.k === "msg") {
    const e = b.nickmap && b.nickmap.get(ircLower(l.n));
    nk.textContent = (e && e[0] ? e[0][0] : "") + l.n;
    if (l.s) nk.className += " self"; else if (!l.h) nk.style.color = nickColor(l.n);
    mirc(tx, l.x);
  } else if (l.k === "action") { nk.textContent = "*"; mirc(tx, l.n + " " + l.x); }
  else if (l.k === "notice") { nk.textContent = "-" + l.n + "-"; mirc(tx, l.x); }
  else { nk.textContent = MARK[l.k] || "--"; mirc(tx, l.x); }
  nk.title = l.n;
  if (b.name === "*channels") {  // the /list table: hints, and the header gets a hand on its column names
    if (/^\s+#\s+Channel/.test(tx.textContent)) d.classList.add("hdr"), d.title = "Click Channel or Users to sort";
    else if (/^\s+\d+\.\s+[#&]/.test(tx.textContent)) d.classList.add("chrow"), d.title = "Double click to join";
  }
  if (l.n && !l.s && b.type !== "status" && (l.k === "msg" || l.k === "action" || l.k === "notice")) nk.oncontextmenu = e => askMenu(e, l.n);
  d.append(ts, nk, tx);
  return d;
}

function label(b) { return b.type === "status" ? b.srv : b.name; }

// a folded network (click its name here, or right click its tab in the terminal) lists only its
// server tab with "+N" in the color of their activity; Alt+arrows and Alt+A still go through them
function renderSide() {
  const side = $("#side"); side.textContent = "";
  let lastSrv = null, st = null;
  order.forEach((id, i) => {
    const b = bufs.get(id); if (!b) return;
    if (b.srv !== lastSrv) {
      const h = document.createElement("div"); h.className = "srv"; lastSrv = b.srv;
      st = b.type === "status" && !b.home ? b : null;
      h.textContent = b.srv + (st ? (st.fold ? " ▸" : " ▾") : "");
      if (st) { h.dataset.id = id; h.title = st.fold ? "Show its channels" : "Hide its channels"; h.onclick = () => send({t: "fold", buf: id}); }
      side.append(h);
    }
    if (st && st.fold && b !== st && id !== active) return;
    let act = b.act, hid = 0;
    if (b === st && st.fold)
      for (const x of order) { const o = bufs.get(x); if (o && o !== b && o.srv === b.srv && x !== active) hid++, act = Math.max(act, o.act); }
    const t = document.createElement("div");
    t.className = "tab" + (id === active ? " active" : "") + (act ? " a" + act : "") +
      (b.home ? " home" : b.type === "status" ? " server" : b.type === "shell" ? " shell" : "") +
      ((b.type === "channel" && !b.joined) || b.state !== "connected" ? " off" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const nm = document.createElement("span"); nm.textContent = b.type === "status" ? "status" : b.name + (b.e2e ? " 🔒" : "");
    t.append(n, nm);
    if (hid) { const mo = document.createElement("span"); mo.className = "more"; mo.textContent = "+" + hid; t.append(mo); }
    t.onclick = () => { select(id); side.classList.remove("open"); };
    if (b.type === "channel") t.oncontextmenu = e => askMenu(e, "", id);
    side.append(t);
  });
}

function renderTopic() {
  const b = bufs.get(active), t = $("#topic .t"); t.textContent = "";
  if (!b) return;
  if (b.type === "channel") mirc(t, b.topic || "");
  else if (b.name === "*channels") t.textContent = "Channel list: /list again refreshes it · /join #channel";
  else if (b.type === "query") t.textContent = "Query with " + b.name;
  else if (b.type === "shell") t.textContent = "Shell: it runs in iSekur's terminal only";
  else if (b.home) t.textContent = "iSekur - multi-server IRC with a built-in webchat";
  else t.textContent = b.srv + " - " + b.state;
  t.title = t.textContent;
  $("#prompt").textContent = "[" + label(b) + "]";
  const nick = b.me ? b.me + " · " : "";
  const st = $("#status"); st.textContent = "";
  const add = (txt, bold) => { const e = document.createElement(bold ? "b" : "span"); e.textContent = txt; st.append(e); };
  add("[" + nick); add(label(b) + (b.modes ? "(+" + b.modes + ")" : ""), true); add("]  ");
  const acts = order.map((id, i) => [i + 1, bufs.get(id)]).filter(([, x]) => x && x.act);
  if (acts.length) add("[Act: " + acts.map(([i]) => i).join(",") + "]");
}

function renderNicks() {
  const el = $("#nicks"), b = bufs.get(active);
  el.style.display = b && b.type === "channel" ? "" : "none";
  el.textContent = "";
  if (!b || b.type !== "channel") return;
  const pf = b.prefixes || "@+";
  const rank = p => p ? (pf.indexOf(p[0]) < 0 ? pf.length : pf.indexOf(p[0])) : pf.length;
  const list = [...b.nicks].sort((x, y) => rank(x[0]) - rank(y[0]) || ircLower(x[1]).localeCompare(ircLower(y[1])));
  const hd = document.createElement("div"); hd.className = "hd"; hd.textContent = list.length + " users"; el.append(hd);
  for (const [p, n, away] of list) {
    const d = document.createElement("div");
    d.className = "u" + (p ? (p[0] === "+" ? " voice" : " op") : "") + (away ? " away" : "");
    d.textContent = (p ? p[0] : " ") + n;
    d.onclick = () => send({t: "input", buf: active, text: "/query " + n});
    d.oncontextmenu = e => askMenu(e, n);
    el.append(d);
  }
}

function renderMsgs() {
  const m = $("#msgs"), b = bufs.get(active); m.textContent = "";
  if (!b) return;
  const frag = document.createDocumentFragment();
  const mark = b.unread > 0 && b.unread < b.lines.length ? b.lines.length - b.unread : -1;
  b.lines.forEach((l, i) => {
    if (i === mark) { const d = document.createElement("div"); d.className = "newmark"; d.textContent = "new"; frag.append(d); }
    frag.append(lineEl(b, l));
  });
  m.append(frag); m.scrollTop = m.scrollHeight;
}

function select(id) {
  if (!bufs.has(id)) return;
  if (active !== id && bufs.has(active)) send({t: "seen", buf: active});
  active = id;
  const b = bufs.get(id);
  if (b.act) { b.act = 0; send({t: "read", buf: id}); }
  renderSide(); renderTopic(); renderNicks(); renderMsgs();
  if (matchMedia("(min-width: 761px)").matches) $("#line").focus();
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function applyTheme() {
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(theme.el || {})) {
    if (v.fg) r.setProperty("--" + k + "-fg", v.fg); else r.removeProperty("--" + k + "-fg");
    if (v.bg) r.setProperty("--" + k + "-bg", v.bg); else r.removeProperty("--" + k + "-bg");
  }
  const d = (theme.el || {}).default || {};
  if (d.bg) r.setProperty("--bg", d.bg);
  if (d.fg) r.setProperty("--fg", d.fg);
}

function onMsg(ev) {
  const m = JSON.parse(ev.data);
  if (m.t === "theme") { theme = m; applyTheme(); renderMsgs(); }
  else if (m.t === "buf") {
    const old = bufs.get(m.id);
    m.lines = old ? old.lines : [];
    m.nickmap = new Map(m.nicks.map(e => [ircLower(e[1]), e]));
    bufs.set(m.id, m);
    if (m.id === active && m.act && document.hasFocus()) { m.act = 0; send({t: "read", buf: m.id}); }
    renderSide();
    if (m.id === active) { renderTopic(); renderNicks(); }
  } else if (m.t === "lines") {
    const b = bufs.get(m.buf); if (b) b.lines = m.lines;
    if (m.buf === active) renderMsgs();
  } else if (m.t === "line") {
    const b = bufs.get(m.buf); if (!b) return;
    b.lines.push(m.line); b.unread = m.u; if (b.lines.length > 2000) b.lines.shift();
    alertFor(b, m.buf, m.line);
    if (m.buf === active) {
      const box = $("#msgs"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.append(lineEl(b, m.line));
      while (box.childElementCount > 2000) box.firstChild.remove();
      if (atBottom) box.scrollTop = box.scrollHeight;
    }
  } else if (m.t === "close") {
    bufs.delete(m.buf);
    if (m.buf === active) { const i = order.indexOf(m.buf); active = order[i > 0 ? i - 1 : 1] || order[0]; }
  } else if (m.t === "order") {
    order = m.ids;
    if (!bufs.has(active)) { active = order[0]; select(active); } else renderSide();
  } else if (m.t === "active") {
    select(m.buf);
  } else if (m.t === "cmds") {
    cmds = m.list;
  } else if (m.t === "menu") {
    showMenu(m);
  } else if (m.t === "about") {
    renderAbout(m);
  } else if (m.t === "settings") {
    renderSettings(m.list);
  }
}

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = onMsg;
  ws.onclose = () => { ws = null; setTimeout(boot, 3000); };
}

async function boot() {
  const r = await fetch("/session", {credentials: "same-origin"}).catch(() => null);
  if (!r) { setTimeout(boot, 3000); return; }
  if (r.ok) { $("#login").style.display = "none"; $("#app").style.display = "grid"; connect(); }
  else { $("#app").style.display = "none"; $("#login").style.display = "flex"; $("#lu").focus(); }
}

$("#lf").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/login", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user: $("#lu").value, pass: $("#lp").value})});
  if (r.ok) { $("#lp").value = ""; $("#loginerr").textContent = ""; boot(); return; }
  const j = await r.json().catch(() => ({}));
  $("#loginerr").textContent = r.status === 429 ? "Too many attempts. Try again in " + j.wait + "s." : "Wrong user or password.";
};
$("#logout").onclick = async () => { await fetch("/logout", {method: "POST", credentials: "same-origin"}); if (ws) { ws.onclose = null; ws.close(); } boot(); };
$("#menu").onclick = () => $("#side").classList.toggle("open");
// desktop: hide/show the list (remembered); phone: open/close the overlay
const narrow = matchMedia("(max-width: 760px)");
try { if (localStorage.getItem("nicks") === "0") $("#nicks").classList.add("off"); } catch (e) {}
// click the topic to see all of it
$("#topic .t").onclick = e => { if (!e.target.closest("a")) e.currentTarget.classList.toggle("full"); };
// + : a new server, sent as /server host port [-tls] [-noverify] -name N -nick X
const dsrv = $("#dsrv"), fs = dsrv.querySelector("form").elements;
$("#addsrv").onclick = () => { $("#side").classList.remove("open"); dsrv.querySelector("form").reset(); dsrv.showModal(); };
fs.tls.onchange = () => { if (fs.port.value === "6667" || fs.port.value === "6697") fs.port.value = fs.tls.checked ? "6697" : "6667"; fs.verify.disabled = !fs.tls.checked; };
dsrv.onclose = () => {
  if (dsrv.returnValue !== "ok") return;
  const host = fs.host.value.trim(), name = fs.name.value.trim(), nick = fs.nick.value.trim();
  let cmd = "/server " + host + " " + (fs.port.value || (fs.tls.checked ? 6697 : 6667));
  if (fs.tls.checked) cmd += " -tls" + (fs.verify.checked ? "" : " -noverify");
  if (name) cmd += " -name " + name;
  if (nick) cmd += " -nick " + nick;
  send({t: "input", buf: active, text: cmd});
  if (fs.save.checked) send({t: "input", buf: active, text: "/save"});
};
// ⓘ : /about in a dialog; the lines come from iSekur (the same text as the terminal's *about tab)
const dabout = $("#dabout");
function openAbout() { $("#side").classList.remove("open"); send({t: "about", buf: active}); dabout.showModal(); }
dabout.onclose = () => clearInterval(typer);
$("#aboutbtn").onclick = openAbout;
// s up to its n-th visible character, the mIRC codes kept (like mirc_prefix in iSekur)
function mircPrefix(s, n) {
  let i = 0, seen = 0;
  const run = re => { const m = re.exec(s.slice(i)); if (m) i += m[0].length; };
  while (i < s.length) {
    const c = s[i];
    if (c === "\x03") { i++; run(/^\d{1,2}(?:,\d{1,2})?/); continue; }
    if (c === "\x04") { i++; run(/^[0-9a-fA-F]{6}(?:,[0-9a-fA-F]{6})?/); continue; }
    if (c < " ") { i++; continue; }
    if (seen === n) break;
    i += s.codePointAt(i) > 0xffff ? 2 : 1; seen++;
  }
  return s.slice(0, i);
}
let typer = 0;
function renderAbout(m) {
  const ban = $("#abanner"), txt = $("#atext"); ban.textContent = txt.textContent = "";
  clearInterval(typer);
  const typed = [];
  m.lines.forEach((l, i) => {
    const d = document.createElement("div");
    if (!l) d.textContent = " ";
    else if (m.typed.includes(i) && !matchMedia("(prefers-reduced-motion: reduce)").matches) typed.push([d, l]), d.textContent = " ";
    else mirc(d, l);
    if (i < 6) ban.append(d); else d.style.animationDelay = (i - 6) * 60 + "ms", txt.append(d);
  });
  // the typed lines, one after the other, ~30 characters a second with a ▌ cursor
  let k = 0, n = 0, wait = 12;
  typer = setInterval(() => {
    if (wait-- > 0) return;
    if (k >= typed.length) return clearInterval(typer);
    const [d, l] = typed[k];
    d.textContent = ""; mirc(d, mircPrefix(l, ++n));
    if (mircPrefix(l, n) !== l) d.insertAdjacentText("beforeend", "\u258C");
    else k++, n = 0, wait = 9;
  }, 33);
}
// ⚙ : every setting, edited in place; changes go out as /set lines (and /save)
const dset = $("#dset"); let setRows = [];
$("#setbtn").onclick = () => { $("#side").classList.remove("open"); $("#setlist").textContent = "Loading..."; send({t: "settings", buf: active}); dset.showModal(); };
function renderSettings(list) {
  const box = $("#setlist"); box.textContent = ""; setRows = [];
  let last = null;
  for (const [sec, k, v, def, uns, secret] of list) {
    const full = (sec === "general" ? "" : sec + ".") + k;
    if (sec !== last) { const h = document.createElement("div"); h.className = "sec"; h.textContent = "[" + sec + "]"; box.append(h); last = sec; }
    const kl = document.createElement("div"); kl.className = "k" + (+uns ? " uns" : ""); kl.textContent = k; kl.title = full;
    const inp = document.createElement("input");
    if (+secret) { inp.type = "password"; inp.placeholder = v ? "******** (set; type to change)" : "(not set)"; inp.autocomplete = "new-password"; }
    else { inp.value = v; inp.placeholder = def ? "default: " + def : "(not set)"; }
    const orig = +secret ? "" : v;
    inp.oninput = () => inp.classList.toggle("chg", inp.value !== orig);
    box.append(kl, inp);
    setRows.push({full, sec, k, inp, orig, kl});
  }
  filterSettings();
}
function filterSettings() {
  const q = $("#setq").value.toLowerCase();
  for (const r of setRows) { const show = !q || r.full.toLowerCase().includes(q); r.kl.hidden = r.inp.hidden = !show; }
  for (const h of $("#setlist").querySelectorAll(".sec")) {
    let n = h.nextElementSibling, any = false;
    while (n && !n.classList.contains("sec")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
    h.hidden = !any;
  }
}
$("#setq").oninput = filterSettings;
dset.querySelector("form").onsubmit = e => {
  const how = e.submitter && e.submitter.value;
  if (how !== "apply" && how !== "save") return;
  e.preventDefault();  // stays open: the list comes back with the new values
  let n = 0;
  for (const r of setRows)
    if (r.inp.value !== r.orig) { send({t: "input", buf: active, text: "/set " + r.full + " " + (r.inp.value === "" ? '""' : r.inp.value)}); n++; }
  if (how === "save") send({t: "input", buf: active, text: "/save"});
  $("#setmsg").textContent = n ? n + " changed" + (how === "save" ? " and saved" : " (not saved yet: Apply & save, or /save)") : how === "save" ? "Saved" : "Nothing changed";
  send({t: "settings", buf: active});
};
$("#nickbtn").onclick = () => {
  if (narrow.matches) return $("#nicks").classList.toggle("open");
  const off = $("#nicks").classList.toggle("off");
  try { localStorage.setItem("nicks", off ? "0" : "1"); } catch (e) {}
};

let comp = null, cmds = [];
$("#line").addEventListener("keydown", e => {
  const inp = e.target;
  if (e.key === "Tab") {
    e.preventDefault();
    const b = bufs.get(active); if (!b) return;
    if (!comp) {
      const v = inp.value, end = inp.selectionStart, start = v.lastIndexOf(" ", end - 1) + 1, pfx = ircLower(v.slice(start, end));
      // command names in the first word ("/jo") and after "/help ", nicks elsewhere
      const help = /^\/help \S*$/i.test(v.slice(0, end)), cmd = start === 0 && v[0] === "/" && v[1] !== "/";
      if (!pfx && !help && !cmd) return;
      const list = cmd ? cmds.filter(c => c.startsWith(pfx.slice(1))).map(c => "/" + c + " ")
        : help ? cmds.filter(c => c.startsWith(pfx)).map(c => c + " ")
        : b.nicks.map(n => n[1]).filter(n => ircLower(n).startsWith(pfx)).sort((x, y) => ircLower(x).localeCompare(ircLower(y)))
            .map(n => n + (start === 0 ? ": " : " "));
      if (!list.length) return;
      comp = {list, i: -1, start, end, v};
    }
    comp.i = (comp.i + 1) % comp.list.length;
    const word = comp.list[comp.i];
    inp.value = comp.v.slice(0, comp.start) + word + comp.v.slice(comp.end);
    inp.selectionStart = inp.selectionEnd = comp.start + word.length;
    return;
  }
  comp = null;
  if (e.key === "ArrowUp" && hpos > 0) { e.preventDefault(); inp.value = hist[--hpos]; }
  else if (e.key === "ArrowDown" && hpos < hist.length) { e.preventDefault(); inp.value = ++hpos === hist.length ? "" : hist[hpos]; }
});
$("#input").onsubmit = e => {
  e.preventDefault();
  const v = $("#line").value; if (!v) return;
  if (hist[hist.length - 1] !== v) hist.push(v);
  hpos = hist.length;
  if (/^\/about\s*$/i.test(v)) { $("#line").value = ""; openAbout(); return; }  // a dialog here, not a tab
  send({t: "input", buf: active, text: v});
  $("#line").value = "";
};
document.addEventListener("keydown", e => {
  if (!e.altKey) return;
  const i = order.indexOf(active);
  if (/^Digit\d$/.test(e.code)) { const n = (+e.code[5] || 10) - 1; if (order[n]) select(order[n]); }
  else if (e.key === "ArrowRight") select(order[(i + 1) % order.length]);
  else if (e.key === "ArrowLeft") select(order[(i - 1 + order.length) % order.length]);
  else if (e.code === "KeyA") {  // next tab with activity, highlights first, like Ctrl+A in the terminal
    const rest = order.slice(i + 1).concat(order.slice(0, i + 1)).filter(x => bufs.get(x) && bufs.get(x).act);
    const best = Math.max(0, ...rest.map(x => bufs.get(x).act));
    if (best) select(rest.find(x => bufs.get(x).act === best));
  }
  else return;
  e.preventDefault();
});
// Highlights and private messages you're not looking at: a count in the tab
// title, plus a desktop notification once the bell is switched on.
let missed = 0, notifyOn = false;
try { notifyOn = localStorage.getItem("notify") === "1"; } catch (e) {}
const canNotify = () => notifyOn && "Notification" in window && Notification.permission === "granted";
function bell() { $("#bell").textContent = canNotify() ? "🔔" : "🔕"; $("#bell").title = canNotify() ? "Notifications on" : "Notifications off"; }
function alertFor(b, id, l) {
  // status windows only hold copies (window 1) or server chatter: the original already alerted
  const personal = b.type !== "status" && (l.h || (b.type === "query" && !l.s && (l.k === "msg" || l.k === "action")));
  if (!personal || (!document.hidden && document.hasFocus() && id === active)) return;
  document.title = "(" + ++missed + ") iSekur Webchat";
  if (!canNotify()) return;
  try {  // Android Chrome only allows notifications from a service worker: the title count still works
    const n = new Notification(b.type === "query" ? l.n : l.n + " in " + b.name, {body: l.x.replace(/\x03\d{0,2}(,\d{1,2})?|\x04[0-9a-f]{6}(,[0-9a-f]{6})?|[\x00-\x1f]/gi, ""), tag: "isekur-" + id});
    n.onclick = () => { window.focus(); select(id); n.close(); };
  } catch (e) {}
}
function seen() { missed = 0; document.title = "iSekur Webchat"; }
document.addEventListener("visibilitychange", () => { if (!document.hidden) seen(); });
$("#bell").onclick = async () => {
  if (!("Notification" in window)) { $("#bell").title = "This browser has no notifications"; return; }
  notifyOn = !canNotify();
  if (notifyOn && Notification.permission !== "granted") notifyOn = await Notification.requestPermission() === "granted";
  try { localStorage.setItem("notify", notifyOn ? "1" : "0"); } catch (e) {}
  bell();
};
bell();
// the word under the pointer in the chat (split on spaces only: "#chan" keeps its "#")
function wordAt(e) {
  const r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY)
          : (p => p && {startContainer: p.offsetNode, startOffset: p.offset})(document.caretPositionFromPoint?.(e.clientX, e.clientY));
  const n = r && r.startContainer;
  if (!n || n.nodeType !== 3) return "";
  const t = n.textContent, i = r.startOffset;
  const a = t.lastIndexOf(" ", i - 1) + 1, z = t.indexOf(" ", i);
  return t.slice(a, z < 0 ? t.length : z).replace(/[,.;:!?)\]}'"]+$/, "").replace(/^[(\[{'"]+/, "");
}
const isChan = w => /^[#&][^\s,]+$/.test(w);
// *channels: a click on the Channel or Users header sorts by it
$("#msgs").addEventListener("click", e => {
  const b = bufs.get(active), w = wordAt(e);
  if (b && b.name === "*channels" && (w === "Channel" || w === "Users") && e.target.closest(".l.hdr"))
    send({t: "input", buf: active, text: "/list sort " + (w === "Channel" ? "name" : "users")});
});
// double click a #channel in the chat joins it; in *channels anywhere on its row
$("#msgs").addEventListener("dblclick", e => {
  const b = bufs.get(active);
  if (!b || !b.srv) return;
  let w = wordAt(e);
  const row = e.target.closest(".l");
  if (!isChan(w) && b.name === "*channels" && row) w = (row.querySelector(".tx").textContent.match(/[#&][^\s,]+/) || [""])[0];
  if (isChan(w)) { window.getSelection().removeAllRanges(); send({t: "input", buf: active, text: "/join " + w}); }
});
window.addEventListener("focus", seen);
window.addEventListener("focus", () => { const b = bufs.get(active); if (b && b.act) { b.act = 0; send({t: "read", buf: active}); renderSide(); } });
// right click (long press on phones) on a nick or a channel tab: the same menu as the terminal's, built by iSekur
let menuAt = [0, 0], menuBuf = 0;
function askMenu(e, nick, buf = active) { e.preventDefault(); menuAt = [e.clientX, e.clientY]; menuBuf = buf; send({t: "menu", buf, nick}); }
function closeMenu() { const o = $("#ctx"); if (o) o.remove(); }
function showMenu(m) {
  closeMenu();
  if (!m.items.length) return;
  const box = document.createElement("div"); box.id = "ctx";
  const hd = document.createElement("div"); hd.className = "hd"; hd.textContent = m.nick; box.append(hd);
  for (const [label, cmd] of m.items) {
    if (!label) { box.append(document.createElement("hr")); continue; }
    const it = document.createElement("div"); it.className = "it"; it.textContent = label;
    it.onclick = () => {
      closeMenu();
      if (cmd[0] === "?") {  // "?question\n/command": ask first
        const nl = cmd.indexOf("\n");
        if (confirm(cmd.slice(1, nl))) send({t: "input", buf: menuBuf, text: cmd.slice(nl + 1)});
      } else if (/[ :]$/.test(cmd)) { $("#line").value = cmd; $("#line").focus(); }  // you finish it
      else send({t: "input", buf: menuBuf, text: cmd});
    };
    box.append(it);
  }
  document.body.append(box);
  box.style.left = Math.max(0, Math.min(menuAt[0], innerWidth - box.offsetWidth - 4)) + "px";
  box.style.top = Math.max(0, Math.min(menuAt[1], innerHeight - box.offsetHeight - 4)) + "px";
}
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
boot();
