name: ci
on: [push, pull_request]
# a newer push to the same branch cancels the run still queued or running (macOS runners are scarce)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev libpam0g-dev
      - run: make CXX=${{ matrix.cxx }} && make test CXX=${{ matrix.cxx }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev libpam0g-dev
      - run: make test OPT="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" LDFLAGS="-fsanitize=address,undefined"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - run: make && make test

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake
          run: gmake && gmake test

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - uses: vmactions/openbsd-vm@v1
        with:
          prepare: pkg_add gmake libiconv
          run: gmake && gmake test

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - uses: vmactions/netbsd-vm@v1
        with:
          prepare: /usr/sbin/pkg_add gmake
          run: gmake && gmake test

  alpine:  # musl, not glibc; plain docker, the setup-alpine action breaks on the runner's sudo-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      # as the runner's own uid, like the other jobs: the tests must not run as root
      - run: |
          docker run --rm -e UID_=$(id -u) -v "$PWD:/w" -w /w alpine:latest sh -c '
            apk add --no-cache build-base openssl-dev zlib-dev linux-pam-dev &&
            adduser -D -u $UID_ ci && su ci -c "make && make test"'

  cygwin:
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    steps:
      - run: git config --global core.autocrlf input
        shell: cmd
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: gcanosa/isekur-plugins, path: isekur-plugins }  # the plugin catalog, for make test
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-g++ make libssl-devel zlib-devel
      - run: cd "$(cygpath "$GITHUB_WORKSPACE")" && make && make test
