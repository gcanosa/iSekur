name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make CXX=${{ matrix.cxx }} && make test CXX=${{ matrix.cxx }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: make test OPT="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" LDFLAGS="-fsanitize=address,undefined"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: make && make test

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y gmake
          run: gmake && gmake test

  cygwin:
    runs-on: windows-latest
    continue-on-error: true  # experimental target
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    steps:
      - run: git config --global core.autocrlf input
        shell: cmd
      - uses: actions/checkout@v5
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-g++ make libssl-devel
      - run: cd "$(cygpath "$GITHUB_WORKSPACE")" && make && make test
